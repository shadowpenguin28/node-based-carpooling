services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build: .
    volumes:
      - .:/app
      - staticfiles:/app/static
    env_file:
      - ./.env

    depends_on:
      - db

  nginx:
    image: nginx
    ports:
    - 80:80
    volumes:
      - staticfiles:/app/static
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  staticfiles:
